<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Counter Cá Nhân</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700&display=swap");

      :root {
        --bg: #0a1420;
        --bg-panel: #0f1e2e;
        --bg-panel-2: #142838;
        --line: #24405a;
        --gold: #c9a75c;
        --gold-dim: #7d6a3f;
        --teal: #3fc7b8;
        --text: #dce6ee;
        --text-dim: #7f96a8;
        --danger: #c9584c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: "Marcellus", serif;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      header {
        padding: 26px 32px 18px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 26px;
        margin: 0;
        color: var(--gold);
      }
      header .sub {
        color: var(--text-dim);
        font-size: 13px;
        margin-top: 2px;
      }

      nav.roles {
        display: flex;
        gap: 2px;
        padding: 0 32px;
        border-bottom: 1px solid var(--line);
        background: var(--bg-panel);
        overflow-x: auto;
      }
      nav.roles button {
        background: none;
        border: none;
        color: var(--text-dim);
        padding: 14px 18px;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 600;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      nav.roles button.active {
        color: var(--gold);
        border-bottom-color: var(--gold);
      }
      nav.roles button:hover {
        color: var(--text);
      }

      main {
        padding: 28px 32px 60px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .search {
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 9px 12px;
        color: var(--text);
        font-size: 13px;
        width: 240px;
        font-family: "Inter", sans-serif;
      }
      .search::placeholder {
        color: var(--text-dim);
      }

      .btn {
        background: var(--gold);
        color: #0a1420;
        border: none;
        padding: 9px 16px;
        border-radius: 3px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        font-family: "Inter", sans-serif;
      }
      .btn:hover {
        background: #dab868;
      }
      .btn.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
      }
      .btn.secondary:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      .btn.small {
        padding: 6px 12px;
        font-size: 12px;
      }
      .btn.danger {
        background: transparent;
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      .btn.danger:hover {
        background: var(--danger);
        color: #0a1420;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 14px;
      }
      .champ-card {
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.15s;
        text-align: center;
      }
      .champ-card:hover {
        border-color: var(--gold);
        transform: translateY(-2px);
      }
      .champ-card .img {
        width: 100%;
        aspect-ratio: 1;
        background: var(--bg-panel-2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-size: 11px;
        overflow: hidden;
      }
      .champ-card .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .champ-card .name {
        padding: 8px 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .champ-card .meta {
        padding: 0 6px 8px;
        font-size: 11px;
        color: var(--text-dim);
      }

      .add-card {
        background: none;
        border: 1px dashed var(--line);
        border-radius: 4px;
        aspect-ratio: 0.78;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 24px;
      }
      .add-card:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .empty {
        color: var(--text-dim);
        padding: 40px 0;
        text-align: center;
        font-size: 14px;
      }

      .back {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 20px;
        padding: 0;
      }
      .back:hover {
        color: var(--gold);
      }

      .matchup-layout {
        display: grid;
        grid-template-columns: 1fr 1.15fr 1fr;
        gap: 22px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .matchup-layout {
          grid-template-columns: 1fr;
        }
        .matchup-layout .center {
          order: -1;
          margin-bottom: 6px;
        }
      }

      .col-title {
        font-size: 12px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .col-title span.n {
        color: var(--gold);
      }

      .matchup-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .matchup-row:hover {
        border-color: var(--gold);
      }
      .matchup-row .img {
        width: 36px;
        height: 36px;
        border-radius: 3px;
        overflow: hidden;
        background: var(--bg-panel-2);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: var(--text-dim);
      }
      .matchup-row .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .matchup-row .name {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
      }
      .matchup-row .stars {
        color: var(--gold);
        font-size: 12px;
        letter-spacing: 1px;
      }

      .add-matchup-btn {
        width: 100%;
        padding: 10px;
        background: none;
        border: 1px dashed var(--line);
        color: var(--text-dim);
        border-radius: 3px;
        cursor: pointer;
        font-size: 13px;
        margin-top: 2px;
      }
      .add-matchup-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .center-card {
        background: var(--bg-panel);
        border: 1px solid var(--gold-dim);
        border-radius: 5px;
        padding: 22px 16px;
        text-align: center;
        position: sticky;
        top: 20px;
      }
      .center-card .img {
        width: 110px;
        height: 110px;
        border-radius: 5px;
        overflow: hidden;
        background: var(--bg-panel-2);
        border: 1px solid var(--gold-dim);
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-size: 11px;
        cursor: pointer;
      }
      .center-card .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .center-card .img:hover {
        border-color: var(--gold);
      }
      .center-card h2 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .center-card .role-tag {
        color: var(--teal);
        font-size: 12px;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
      }
      .center-card .actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 10, 16, 0.7);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 16px;
        overflow-y: auto;
        z-index: 50;
      }
      .modal {
        background: var(--bg-panel);
        border: 1px solid var(--gold-dim);
        border-radius: 5px;
        width: 100%;
        max-width: 460px;
        padding: 26px;
        margin-bottom: 40px;
      }
      .modal h3 {
        margin: 0 0 18px;
        font-size: 19px;
        color: var(--gold);
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .field .hint {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 4px;
        text-transform: none;
        letter-spacing: 0;
      }
      .field input[type="text"],
      .field textarea,
      .field select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 9px 10px;
        border-radius: 3px;
        font-family: "Inter", sans-serif;
        font-size: 14px;
      }
      .field textarea {
        resize: vertical;
        min-height: 60px;
      }
      .field .imgpick {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .field .imgpick .prev {
        width: 48px;
        height: 48px;
        border-radius: 3px;
        background: var(--bg);
        border: 1px solid var(--line);
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .field .imgpick .prev img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .field .imgpick input[type="file"] {
        font-size: 12px;
        color: var(--text-dim);
        flex: 1;
      }

      .stars-pick {
        display: flex;
        gap: 6px;
        font-size: 22px;
      }
      .stars-pick span {
        cursor: pointer;
        color: var(--line);
      }
      .stars-pick span.on {
        color: var(--gold);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .mdetail {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .mdetail .vs {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .mdetail .vs .side {
        text-align: center;
        cursor: pointer;
      }
      .mdetail .vs .img {
        width: 64px;
        height: 64px;
        border-radius: 4px;
        overflow: hidden;
        background: var(--bg-panel-2);
        margin: 0 auto 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: var(--text-dim);
      }
      .mdetail .vs .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mdetail .vs .side:hover .img {
        border: 1px solid var(--gold);
      }
      .mdetail .vs .arrow {
        color: var(--teal);
        font-size: 20px;
      }
      .mdetail .stars-row {
        text-align: center;
        color: var(--gold);
        font-size: 18px;
        letter-spacing: 2px;
      }
      .mdetail .note-block {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 14px;
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
        min-height: 40px;
      }
      .mdetail .note-block:empty::before {
        content: "(chưa có ghi chú)";
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sổ Counter Cá Nhân</h1>
      <div class="sub">Champion pool &amp; matchup notes của riêng bạn</div>
    </header>

    <nav class="roles" id="roleNav"></nav>

    <main id="main"></main>

    <script>
      const ROLES = ["TOP", "JUNGLE", "MID", "ADC", "SUPPORT"];
      /* champion: {id,name,image,role}
   matchup:  {id, winnerId, loserId, strength, note}   -- winner counters loser */
      let state = { champions: [], matchups: [] };

      let currentRole = "TOP";
      let currentChampId = null;
      let pendingImage = null;

      const uid = () => Math.random().toString(36).slice(2, 10);
      const $ = (sel) => document.querySelector(sel);

      function findChamp(id) {
        return state.champions.find((c) => c.id === id);
      }
      function findChampByName(name) {
        const n = name.trim().toLowerCase();
        return state.champions.find((c) => c.name.trim().toLowerCase() === n);
      }
      /* matchups where champId is the winner (champId counters someone) */
      function champCounters(champId) {
        return state.matchups.filter((m) => m.winnerId === champId);
      }
      /* matchups where champId is the loser (someone counters champId) */
      function champCounteredBy(champId) {
        return state.matchups.filter((m) => m.loserId === champId);
      }

      function renderRoleNav() {
        const nav = $("#roleNav");
        nav.innerHTML = ROLES.map(
          (r) =>
            `<button class="${r === currentRole ? "active" : ""}" onclick="setRole('${r}')">${r}</button>`,
        ).join("");
      }
      function setRole(r) {
        currentRole = r;
        currentChampId = null;
        renderRoleNav();
        renderMain();
      }

      function renderMain() {
        if (currentChampId) {
          renderChampionDetail();
          return;
        }
        const list = state.champions.filter((c) => c.role === currentRole);
        const searchVal = ($("#searchBox")?.value || "").trim().toLowerCase();
        const filtered = searchVal
          ? list.filter((c) => c.name.toLowerCase().includes(searchVal))
          : list;

        $("#main").innerHTML = `
    <div class="toolbar">
      <input class="search" id="searchBox" placeholder="Tìm tướng trong ${currentRole}..." value="${searchVal}" oninput="renderMain()">
      <button class="btn" onclick="openAddChampion()">+ Thêm tướng</button>
    </div>
    <div class="grid">
      ${filtered.map((c) => championCardHtml(c)).join("")}
      ${searchVal ? "" : `<div class="add-card" onclick="openAddChampion()">+</div>`}
    </div>
    ${filtered.length === 0 ? `<div class="empty">Chưa có tướng nào trong ${currentRole}. Bấm "+ Thêm tướng" để bắt đầu.</div>` : ""}
  `;
        const box = $("#searchBox");
        if (box && searchVal) {
          box.focus();
          box.selectionStart = box.selectionEnd = box.value.length;
        }
      }

      function championCardHtml(c) {
        const counters = champCounters(c.id).length;
        const countered = champCounteredBy(c.id).length;
        return `
    <div class="champ-card" onclick="openChampion('${c.id}')">
      <div class="img">${c.image ? `<img src="${c.image}">` : "Chưa có ảnh"}</div>
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="meta">${countered} bị counter · ${counters} counter</div>
    </div>`;
      }

      function openChampion(id) {
        currentChampId = id;
        renderMain();
      }

      function renderChampionDetail() {
        const c = findChamp(currentChampId);
        if (!c) {
          currentChampId = null;
          renderMain();
          return;
        }
        const iCounter = champCounters(c.id); // c counters these -> right column
        const counteredBy = champCounteredBy(c.id); // these counter c -> left column

        $("#main").innerHTML = `
    <button class="back" onclick="currentChampId=null;renderMain()">&larr; Quay lại ${c.role}</button>

    <div class="matchup-layout">
      <div class="left">
        <div class="col-title">Bị Counter Bởi <span class="n">${counteredBy.length}</span></div>
        ${counteredBy.map((m) => matchupRowHtml(m, findChamp(m.winnerId))).join("")}
        <button class="add-matchup-btn" onclick="openAddMatchup('${c.id}','COUNTERED_BY')">+ Thêm champion counter tôi</button>
      </div>

      <div class="center">
        <div class="center-card">
          <div class="img" onclick="openEditChampion('${c.id}')">${c.image ? `<img src="${c.image}">` : "Bấm để thêm ảnh"}</div>
          <h2>${escapeHtml(c.name)}</h2>
          <div class="role-tag">${c.role}</div>
          <div class="actions">
            <button class="btn small secondary" onclick="openEditChampion('${c.id}')">Sửa</button>
            <button class="btn small danger" onclick="deleteChampion('${c.id}')">Xóa</button>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="col-title">Tôi Counter <span class="n">${iCounter.length}</span></div>
        ${iCounter.map((m) => matchupRowHtml(m, findChamp(m.loserId))).join("")}
        <button class="add-matchup-btn" onclick="openAddMatchup('${c.id}','I_COUNTER')">+ Thêm champion tôi counter</button>
      </div>
    </div>
  `;
      }

      /* opponent = the champion on the other side of this matchup row */
      function matchupRowHtml(m, opponent) {
        if (!opponent) return "";
        return `
    <div class="matchup-row" onclick="openMatchupDetail('${m.id}')">
      <div class="img">${opponent.image ? `<img src="${opponent.image}">` : ""}</div>
      <div class="name">${escapeHtml(opponent.name)}</div>
      <div class="stars">${"★".repeat(m.strength)}${"☆".repeat(5 - m.strength)}</div>
    </div>`;
      }

      /* ---------- add / edit champion ---------- */
      function openAddChampion() {
        pendingImage = null;
        showModal(`
    <h3>Thêm tướng</h3>
    <div class="field">
      <label>Tên tướng</label>
      <input type="text" id="fName" placeholder="VD: Jax">
    </div>
    <div class="field">
      <label>Role</label>
      <select id="fRole">${ROLES.map((r) => `<option ${r === currentRole ? "selected" : ""}>${r}</option>`).join("")}</select>
    </div>
    <div class="field">
      <label>Hình ảnh (tùy chọn, có thể thêm sau)</label>
      <div class="imgpick">
        <div class="prev" id="imgPrev"></div>
        <input type="file" accept="image/*" onchange="handleImagePick(event,'imgPrev')">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Hủy</button>
      <button class="btn" onclick="saveChampion()">Lưu</button>
    </div>
  `);
      }
      function saveChampion() {
        const name = $("#fName").value.trim();
        if (!name) {
          $("#fName").focus();
          return;
        }
        if (findChampByName(name)) {
          alert("Tướng này đã tồn tại trong hệ thống rồi.");
          return;
        }
        const role = $("#fRole").value;
        state.champions.push({ id: uid(), name, role, image: pendingImage });
        closeModal();
        renderMain();
      }

      function openEditChampion(id) {
        const c = findChamp(id);
        pendingImage = c.image;
        showModal(`
    <h3>Sửa tướng</h3>
    <div class="field">
      <label>Tên tướng</label>
      <input type="text" id="fName" value="${escapeAttr(c.name)}">
    </div>
    <div class="field">
      <label>Role</label>
      <select id="fRole">${ROLES.map((r) => `<option ${r === c.role ? "selected" : ""}>${r}</option>`).join("")}</select>
    </div>
    <div class="field">
      <label>Hình ảnh</label>
      <div class="imgpick">
        <div class="prev" id="imgPrev">${c.image ? `<img src="${c.image}">` : ""}</div>
        <input type="file" accept="image/*" onchange="handleImagePick(event,'imgPrev')">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Hủy</button>
      <button class="btn" onclick="saveEditChampion('${id}')">Lưu thay đổi</button>
    </div>
  `);
      }
      function saveEditChampion(id) {
        const c = findChamp(id);
        c.name = $("#fName").value.trim() || c.name;
        c.role = $("#fRole").value;
        c.image = pendingImage;
        closeModal();
        renderMain();
      }

      function deleteChampion(id) {
        if (
          !confirm(
            "Xóa tướng này? Các matchup liên quan tới tướng này cũng sẽ bị xóa.",
          )
        )
          return;
        state.champions = state.champions.filter((c) => c.id !== id);
        state.matchups = state.matchups.filter(
          (m) => m.winnerId !== id && m.loserId !== id,
        );
        currentChampId = null;
        renderMain();
      }

      /* ---------- add matchup modal ----------
   Links to a real champion: if the typed name matches an existing champion
   it re-uses that champion (and it will then show up correctly on BOTH
   champions' pages); otherwise it creates a new champion automatically. */
      function openAddMatchup(champId, relation) {
        pendingImage = null;
        const c = findChamp(champId);
        const options = state.champions
          .filter((x) => x.id !== champId)
          .map((x) => `<option value="${escapeAttr(x.name)}">`)
          .join("");
        showModal(`
    <h3>${relation === "I_COUNTER" ? `Champion ${escapeHtml(c.name)} counter` : `Champion counter ${escapeHtml(c.name)}`}</h3>
    <div class="field">
      <label>Tên champion đối phương</label>
      <input type="text" id="mName" list="champOptions" placeholder="VD: Malphite">
      <datalist id="champOptions">${options}</datalist>
      <div class="hint">Nếu tướng đã có trong hệ thống, hai bên sẽ tự động liên kết với nhau. Nếu chưa có, tướng mới sẽ được tạo.</div>
    </div>
    <div class="field">
      <label>Role của champion đối phương</label>
      <select id="mRole">${ROLES.map((r) => `<option ${r === c.role ? "selected" : ""}>${r}</option>`).join("")}</select>
    </div>
    <div class="field">
      <label>Hình ảnh (chỉ dùng nếu tạo tướng mới)</label>
      <div class="imgpick">
        <div class="prev" id="imgPrev"></div>
        <input type="file" accept="image/*" onchange="handleImagePick(event,'imgPrev')">
      </div>
    </div>
    <div class="field">
      <label>Mức độ counter</label>
      <div class="stars-pick" id="starsPick">
        ${[1, 2, 3, 4, 5].map((n) => `<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join("")}
      </div>
    </div>
    <div class="field">
      <label>Ghi chú matchup (lý do, cách chơi, skill quan trọng...)</label>
      <textarea id="mNote" placeholder="VD: Malphite E giảm attack speed, tránh trade dài khi E còn..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Hủy</button>
      <button class="btn" onclick="saveMatchup('${champId}','${relation}')">Lưu</button>
    </div>
  `);
        window._starVal = 3;
        pickStar(3);
      }
      function pickStar(n) {
        window._starVal = n;
        document.querySelectorAll("#starsPick span").forEach((s) => {
          s.classList.toggle("on", parseInt(s.dataset.n) <= n);
        });
      }
      function saveMatchup(champId, relation) {
        const name = $("#mName").value.trim();
        if (!name) {
          $("#mName").focus();
          return;
        }
        const note = $("#mNote").value.trim();
        const strength = window._starVal || 3;

        let opponent = findChampByName(name);
        if (!opponent) {
          opponent = {
            id: uid(),
            name,
            role: $("#mRole").value,
            image: pendingImage,
          };
          state.champions.push(opponent);
        } else if (pendingImage && !opponent.image) {
          opponent.image = pendingImage;
        }

        const winnerId = relation === "I_COUNTER" ? champId : opponent.id;
        const loserId = relation === "I_COUNTER" ? opponent.id : champId;

        const existing = state.matchups.find(
          (m) => m.winnerId === winnerId && m.loserId === loserId,
        );
        if (existing) {
          existing.strength = strength;
          existing.note = note;
        } else {
          state.matchups.push({ id: uid(), winnerId, loserId, strength, note });
        }
        closeModal();
        renderMain();
      }

      /* ---------- matchup detail / edit (note only shows once clicked) ---------- */
      function openMatchupDetail(matchupId) {
        const m = state.matchups.find((x) => x.id === matchupId);
        const winner = findChamp(m.winnerId);
        const loser = findChamp(m.loserId);
        if (!winner || !loser) return;

        showModal(`
    <h3>Chi tiết matchup</h3>
    <div class="mdetail">
      <div class="vs">
        <div class="side" onclick="closeModal();openChampion('${winner.id}')">
          <div class="img">${winner.image ? `<img src="${winner.image}">` : ""}</div>
          <div>${escapeHtml(winner.name)}</div>
        </div>
        <div class="arrow">counters &rarr;</div>
        <div class="side" onclick="closeModal();openChampion('${loser.id}')">
          <div class="img">${loser.image ? `<img src="${loser.image}">` : ""}</div>
          <div>${escapeHtml(loser.name)}</div>
        </div>
      </div>
      <div class="stars-row">${"★".repeat(m.strength)}${"☆".repeat(5 - m.strength)}</div>
      <div>
        <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Ghi chú</label>
        <div class="note-block">${escapeHtml(m.note || "")}</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" onclick="deleteMatchup('${m.id}')">Xóa</button>
      <button class="btn secondary" onclick="editMatchup('${m.id}')">Sửa</button>
      <button class="btn" onclick="closeModal()">Đóng</button>
    </div>
  `);
      }
      function editMatchup(matchupId) {
        const m = state.matchups.find((x) => x.id === matchupId);
        const winner = findChamp(m.winnerId);
        const loser = findChamp(m.loserId);
        showModal(`
    <h3>Sửa matchup — ${escapeHtml(winner.name)} vs ${escapeHtml(loser.name)}</h3>
    <div class="field">
      <label>Mức độ counter</label>
      <div class="stars-pick" id="starsPick">
        ${[1, 2, 3, 4, 5].map((n) => `<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join("")}
      </div>
    </div>
    <div class="field">
      <label>Ghi chú matchup</label>
      <textarea id="mNote">${escapeHtml(m.note || "")}</textarea>
    </div>
    <div class="hint" style="margin-bottom:14px;">Để đổi tên/ảnh tướng, vào trang của tướng đó và bấm Sửa.</div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="openMatchupDetail('${matchupId}')">Hủy</button>
      <button class="btn" onclick="saveEditMatchup('${matchupId}')">Lưu thay đổi</button>
    </div>
  `);
        window._starVal = m.strength;
        pickStar(m.strength);
      }
      function saveEditMatchup(matchupId) {
        const m = state.matchups.find((x) => x.id === matchupId);
        m.strength = window._starVal || m.strength;
        m.note = $("#mNote").value.trim();
        closeModal();
        renderMain();
      }
      function deleteMatchup(matchupId) {
        if (!confirm("Xóa matchup này?")) return;
        state.matchups = state.matchups.filter((x) => x.id !== matchupId);
        closeModal();
        renderMain();
      }

      /* ---------- image handling ---------- */
      function handleImagePick(evt, previewId) {
        const file = evt.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          pendingImage = e.target.result;
          $("#" + previewId).innerHTML = `<img src="${pendingImage}">`;
        };
        reader.readAsDataURL(file);
      }

      /* ---------- modal plumbing ---------- */
      function showModal(html) {
        let ov = document.getElementById("overlay");
        if (!ov) {
          ov = document.createElement("div");
          ov.id = "overlay";
          ov.className = "overlay";
          ov.onclick = (e) => {
            if (e.target === ov) closeModal();
          };
          document.body.appendChild(ov);
        }
        ov.innerHTML = `<div class="modal">${html}</div>`;
        ov.style.display = "flex";
      }
      function closeModal() {
        const ov = document.getElementById("overlay");
        if (ov) ov.style.display = "none";
        pendingImage = null;
      }

      /* ---------- utils ---------- */
      function escapeHtml(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, "&quot;");
      }

      /* ---------- init ---------- */
      renderRoleNav();
      renderMain();
    </script>
  </body>
</html>
